[package]
name = "lwc"
version = "0.10.2"
edition = "2024"
description = "Agent-first CLI for building persistent, source-grounded wikis from local documents"
license = "Apache-2.0"
repository = "https://github.com/JanYork/llm-wiki-cli"
homepage = "https://github.com/JanYork/llm-wiki-cli"
readme = "README.md"
keywords = ["llm", "wiki", "agents", "sqlite", "knowledge-base"]
categories = ["command-line-utilities", "database"]
exclude = [".agent/**", ".local-benchmarks/**", ".pi-subagents/**"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.39", default-features = false, features = ["backup", "bundled", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "=3.1.1"
unicode-segmentation = "1.13.3"

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
sha2 = "0.11"

[package]
name = "lwc"
version = "0.6.1"
edition = "2024"
description = "Agent-first CLI for building persistent, source-grounded wikis from local documents"
license = "Apache-2.0"
repository = "https://github.com/JanYork/llm-wiki-cli"
homepage = "https://github.com/JanYork/llm-wiki-cli"
readme = "README.md"
keywords = ["llm", "wiki", "agents", "sqlite", "knowledge-base"]
categories = ["command-line-utilities", "database"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.39", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "=3.1.1"

[dev-dependencies]
tempfile = "3.27"

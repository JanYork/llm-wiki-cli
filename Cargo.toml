[package]
name = "lwc"
version = "0.19.2"
edition = "2024"
description = "Agent-driven proactive memory CLI for AI agents — autonomously recall, maintain, and evolve persistent, source-grounded knowledge across sessions."
license = "Apache-2.0"
repository = "https://github.com/JanYork/llm-wiki-cli"
homepage = "https://github.com/JanYork/llm-wiki-cli"
readme = "README.md"
keywords = ["agent-memory-system", "ai-agents", "proactive-memory", "knowledge-bases", "context-engineering"]
categories = ["command-line-utilities", "database"]
exclude = [".agent/**", ".agents/**", ".local-benchmarks/**", ".pi-subagents/**", ".superpowers/**", "**/__pycache__/**", "**/*.pyc", "AGENTS.md", "docs/images/**", "docs/superpowers/**"]

[dependencies]
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
ed25519-dalek = "2.2"
futures-util = "0.3"
grafeo = { version = "0.5.42", default-features = false, features = ["edge", "wal", "grafeo-file"] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.39", default-features = false, features = ["backup", "blob", "bundled", "session", "functions"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "stream"] }
rs-fsrs = { version = "=1.2.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "=3.1.1"
surrealdb = { version = "3.2.4", default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
unicode-segmentation = "1.13.3"
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
tempfile = "3.27"

name: Feature request
description: Propose an improvement for lwc.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is blocked or inefficient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: agent_first_value
    attributes:
      label: How this serves the Agent-first persistent Wiki
      description: Explain how the request improves durable source tracking, page maintenance, search, ingest, or related Agent workflows.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you already evaluated.
    validations:
      required: false

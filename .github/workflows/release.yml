name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  RUST_TEST_THREADS: "2"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release acceptance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-quality
          cache-targets: false

      - name: Codex plugin Skill ownership
        run: python3 tests/codex_plugin_install.py

      - name: Viewer
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          git diff --exit-code -- dist

      - name: Team interface
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build

      - name: Package team interface and deployment files
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          archive="lwc-team-${version}"
          mkdir -p "dist/${archive}/admin" "dist/${archive}/deploy"
          cp -R admin/dist "dist/${archive}/admin/"
          cp -R deploy/team "dist/${archive}/deploy/"
          tar -C dist -czf "dist/${archive}.tar.gz" "$archive"
          (cd dist && sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: lwc-team-assets
          path: |
            dist/lwc-team-*.tar.gz
            dist/lwc-team-*.tar.gz.sha256
          if-no-files-found: error

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Full test suite
        run: cargo test --locked --all-targets --all-features

      - name: npm package
        run: node --test tests/npm_package.mjs

      - name: Fallback build and tests
        run: cargo test --locked --all-targets --no-default-features

      - name: Release graph benchmark budgets
        run: >-
          cargo test --locked --release --test graph_benchmark
          external_graph_rebuild_and_update_are_document_granular
          -- --ignored --nocapture

      - name: Package verification
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/lwc-package-target
        run: cargo package --locked

  build:
    needs: quality
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --bins

      - name: Smoke test Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          project="$(mktemp -d)"
          cd "$project"
          "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/lwc" init
          "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/lwc" config show
          "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/lwc" graph status

      - name: Smoke test Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "lwc-smoke"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Push-Location $project
          & "$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release\lwc.exe" init
          & "$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release\lwc.exe" config show
          & "$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release\lwc.exe" graph status
          Pop-Location

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          archive="lwc-${version}-${{ matrix.target }}"
          mkdir -p "dist/${archive}"
          cp "target/${{ matrix.target }}/release/lwc" "dist/${archive}/"
          cp README.md README.zh-CN.md LICENSE "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          cd dist
          shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          cd ..
          for plugin in tutor book practice; do
            archive="lwc-${plugin}-${version}-${{ matrix.target }}"
            mkdir -p "dist/${archive}"
            cp "target/${{ matrix.target }}/release/lwc-${plugin}" "dist/${archive}/"
            tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
            (
              cd dist
              shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
            )
          done

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml).Matches[0].Groups[1].Value
          $archive = "lwc-$version-${{ matrix.target }}"
          $stage = Join-Path dist $archive
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\lwc.exe" $stage
          Copy-Item README.md, README.zh-CN.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "dist\$archive.zip"
          $hash = (Get-FileHash "dist\$archive.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive.zip" | Set-Content "dist\$archive.zip.sha256" -Encoding ascii
          foreach ($plugin in @("tutor", "book", "practice")) {
            $archive = "lwc-$plugin-$version-${{ matrix.target }}"
            $stage = Join-Path dist $archive
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "target\${{ matrix.target }}\release\lwc-$plugin.exe" $stage
            Compress-Archive -Path $stage -DestinationPath "dist\$archive.zip"
            $hash = (Get-FileHash "dist\$archive.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $archive.zip" | Set-Content "dist\$archive.zip.sha256" -Encoding ascii
          }

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: lwc-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0

  team-image:
    name: Publish team server image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: lwc-*
          path: release-assets
          merge-multiple: true
      - name: Prepare verified binaries and interface
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p image/binaries/amd64 image/binaries/arm64 image/admin
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            target="${pair#*:}-unknown-linux-gnu"
            archive="lwc-${version}-${target}"
            (cd release-assets && sha256sum -c "${archive}.tar.gz.sha256")
            tar -xzf "release-assets/${archive}.tar.gz" -C "image/binaries/${arch}" --strip-components=1
          done
          (cd release-assets && sha256sum -c "lwc-team-${version}.tar.gz.sha256")
          tar -xzf "release-assets/lwc-team-${version}.tar.gz" -C image
          cp -R "image/lwc-team-${version}/admin/dist/." image/admin/
          cp deploy/team/Dockerfile.release image/Dockerfile
          echo "LWC_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-team" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64
          load: true
          tags: lwc-team:smoke
      - name: Smoke team container
        shell: bash
        run: |
          docker volume create lwc-team-smoke
          docker run --rm -v lwc-team-smoke:/data lwc-team:smoke server init --data /data --admin-email owner@example.com
          printf '%s\n' '{"data":"/data","listen":"0.0.0.0:8787","public_url":"https://memory.example.com","admin_assets":"/opt/lwc/admin"}' > "${RUNNER_TEMP}/server.jsonc"
          docker run -d --name lwc-team-smoke -p 127.0.0.1:8787:8787 -v lwc-team-smoke:/data -v "${RUNNER_TEMP}/server.jsonc:/etc/lwc/server.jsonc:ro" lwc-team:smoke
          trap 'docker rm -f lwc-team-smoke; docker volume rm lwc-team-smoke' EXIT
          token="$(docker exec lwc-team-smoke cat /data/server-access.token)"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --header "X-LWC-Server-Token: ${token}" http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --header "X-LWC-Server-Token: ${token}" http://127.0.0.1:8787/health
          curl --fail --silent http://127.0.0.1:8787/ | grep -q '<div id="root">'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.LWC_IMAGE }}:${{ github.ref_name }}

  checksums:
    name: Combined checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lwc-*
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: find artifacts -type f -name '*.sha256' -exec cat {} + | tr -d '\r' | sort -k2 > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lwc-checksums
          path: SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - checksums
      - team-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: lwc-*
          path: release-assets
          merge-multiple: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate annotated release notes
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          notes="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
          test -n "$(printf '%s' "$notes" | tr -d '[:space:]')"
          printf '%s\n' "$notes" > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "lwc ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            release-assets/SHA256SUMS \
            install.sh

      - name: Smoke npm installer against release assets
        run: |
          npm install --global ./npm --prefix "${RUNNER_TEMP}/lwc-npm"
          "${RUNNER_TEMP}/lwc-npm/bin/lwc" --version
